# Local development stack. Credentials below are for a throwaway local container only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling -d scheduling"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
