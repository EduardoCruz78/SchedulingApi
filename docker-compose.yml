# Local stack: `docker compose up --build`, then open http://localhost:8080/scalar
# Credentials below are for throwaway local containers only, never for a real deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling -d scheduling"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development: applies migrations and seeds demo data on startup (appsettings.Development.json).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=scheduling;Username=scheduling;Password=scheduling"
      # Override with a real secret through the JWT_SECRET environment variable.
      Jwt__Secret: "${JWT_SECRET:-local-development-only-secret-change-me-0123456789}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
