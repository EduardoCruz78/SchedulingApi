name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Scheduling.slnx

      - name: Verify formatting
        run: dotnet format Scheduling.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build Scheduling.slnx --no-restore -c Release

      # Ubuntu runners ship with Docker, so Testcontainers-based integration tests run here.
      - name: Test
        run: dotnet test --solution Scheduling.slnx --no-build -c Release
