# Render Blueprint: the whole demo deployment as code.
# Render builds the Dockerfile, injects the variables below and health-checks /health.
# The database lives on Neon; paste its connection string when Render asks for it (sync: false).
services:
  - type: web
    name: scheduling-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-1) to keep query latency low; also the closest to Brazil.
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      # Neon connection string (URL or key/value form). Secret: set in the dashboard, never committed.
      - key: ConnectionStrings__Default
        sync: false
      # Random 256-bit value generated by Render once.
      - key: Jwt__Secret
        generateValue: true
      # Demo convenience: migrate and seed on startup. A production pipeline would run a migration bundle instead.
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Database__Seed
        value: "true"
      # Render terminates TLS at its proxy; the client IP arrives in X-Forwarded-For (used by rate limiting).
      - key: ForwardedHeaders__Enabled
        value: "true"
